name: Build On7xreflte Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache clang curl flex \
          gcc git libncurses5-dev libssl-dev lld llvm make python3 unzip zip wget

    - name: Set up Proton Clang
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export ANDROID_MAJOR_VERSION=r

        mkdir -p out
        make O=out on7xreflte_01_defconfig
        make -j$(nproc) O=out Image.gz-dtb

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: On7xreflte-Kernel
        path: out/arch/arm64/boot/Image.gz-dtb
